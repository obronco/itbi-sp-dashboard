name: Update ITBI dashboard

on:
  schedule:
    # 5th of each month at 12:00 UTC ≈ 09:00 BRT
    - cron: "0 12 5 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commits ref/ipca_index.json when IBGE publishes new months
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The IPCA index is committed (ref/ipca_index.json) so the build never
      # depends on IBGE being up; this only adds newly published months.
      - name: Refresh IPCA index
        continue-on-error: true
        run: python scripts/update_ipca.py

      - name: Compute cache keys (recent data changes ~monthly)
        id: datekey
        run: |
          echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          # History = 2006 … (this year − 5). Never misses a year: the recent
          # window is the 5 newest years the Prefeitura lists, which can lag
          # into January (then a year sits in both — same file, harmless).
          echo "hist_until=$(( $(date -u +%Y) - 5 ))" >> "$GITHUB_OUTPUT"

      # Data only changes when Prefeitura publishes a new monthly sheet, so a
      # run triggered just to redeploy index.html (or any run within the same
      # month + unchanged pipeline scripts) can reuse the per-year parquets
      # already built this month instead of re-downloading ~175MB of Excel files.
      # Bust it early by editing the scripts (hashFiles changes the key) or
      # by deleting the cache entry from Settings → Actions → Caches.
      - name: Restore cached parquet
        id: cache-parquet
        uses: actions/cache/restore@v4
        with:
          path: parquet
          key: itbi-parquet-${{ steps.datekey.outputs.ym }}-${{ hashFiles('scripts/download_itbi.py', 'scripts/preprocess_itbi.py') }}

      # The Prefeitura's server intermittently blocks GitHub-hosted runners.
      # Don't let that block deploying site changes: fall back to the parquet
      # currently live on Pages (below) instead of failing the whole run.
      - name: Download ITBI Excel files (last 5 years)
        id: download
        if: steps.cache-parquet.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/download_itbi.py

      - name: Preprocess → parquet
        id: preprocess
        if: steps.download.outcome == 'success'
        run: python scripts/preprocess_itbi.py

      # Saved only when freshly built, so a fallback copy never occupies this
      # month's cache key and the next run retries the download.
      - name: Save parquet to cache
        if: steps.preprocess.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: parquet
          key: ${{ steps.cache-parquet.outputs.cache-primary-key }}

      # History (2006 … this year − 5) barely changes: built once per range and
      # pipeline version, cached without the month, and loaded on demand by
      # the page. A failed download here doesn't block the deploy either.
      - name: Restore cached history
        id: cache-history
        uses: actions/cache/restore@v4
        with:
          path: history
          key: itbi-history-2006-${{ steps.datekey.outputs.hist_until }}-${{ hashFiles('scripts/download_itbi.py', 'scripts/preprocess_itbi.py') }}

      - name: Download history Excel files
        id: download-history
        if: steps.cache-history.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/download_itbi.py --years 2006-${{ steps.datekey.outputs.hist_until }}

      - name: Preprocess history → parquet
        id: preprocess-history
        if: steps.download-history.outcome == 'success'
        run: python scripts/preprocess_itbi.py --years 2006-${{ steps.datekey.outputs.hist_until }} --out-dir history

      - name: Save history to cache
        if: steps.preprocess-history.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: history
          key: ${{ steps.cache-history.outputs.cache-primary-key }}

      # Site data = history + recent years; any year still missing (a failed
      # download) comes from the live site. The live site before per-year
      # files had a single itbi_sp_5y.parquet, which is split into years.
      - name: Assemble data (+ fallback to the live site)
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p site/parquet
          cp history/itbi_*.parquet site/parquet/ 2>/dev/null || true
          cp parquet/itbi_*.parquet site/parquet/ 2>/dev/null || true
          if curl -fsSL --retry 3 -o live_manifest.json "$BASE/parquet/manifest.json"; then
            for f in $(python -c "import json; print(' '.join(e['file'] for e in json.load(open('live_manifest.json'))['years']))"); do
              if [ ! -f "site/parquet/$f" ]; then
                echo "::warning::$f not built in this run — taking the live copy"
                curl -fsSL --retry 3 -o "site/parquet/$f" "$BASE/parquet/$f"
              fi
            done
          elif ! ls site/parquet/itbi_*.parquet >/dev/null 2>&1; then
            echo "::warning::no data built and no live manifest — splitting the live single-file parquet"
            curl -fsSL --retry 3 -o legacy.parquet "$BASE/itbi_sp_5y.parquet"
            python scripts/preprocess_itbi.py --repartition legacy.parquet --out-dir site/parquet
          fi
          python scripts/preprocess_itbi.py --manifest site/parquet

      - name: Prepare site artifact
        run: |
          mkdir -p site
          cp index.html site/
          mkdir -p site/geo
          cp geo/quadras_geo.parquet site/geo/
          ls -lh site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # Pushes made with the workflow's token don't trigger another run
      - name: Commit refreshed IPCA index
        continue-on-error: true
        run: |
          if ! git diff --quiet -- ref/ipca_index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ref/ipca_index.json
            git commit -m "Update IPCA index (IBGE SIDRA) to $(python -c "import json; print(max(json.load(open('ref/ipca_index.json'))['index']))")"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
