name: Update ITBI dashboard

on:
  schedule:
    # 5th of each month at 12:00 UTC ≈ 09:00 BRT
    - cron: "0 12 5 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute cache key (data changes ~monthly)
        id: datekey
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Data only changes when Prefeitura publishes a new monthly sheet, so a
      # run triggered just to redeploy index.html (or any run within the same
      # month + unchanged pipeline scripts) can reuse the per-year parquets
      # already built this month instead of re-downloading ~175MB of Excel files.
      # Bust it early by editing the scripts (hashFiles changes the key) or
      # by deleting the cache entry from Settings → Actions → Caches.
      - name: Restore cached parquet
        id: cache-parquet
        uses: actions/cache/restore@v4
        with:
          path: parquet
          key: itbi-parquet-${{ steps.datekey.outputs.ym }}-${{ hashFiles('scripts/download_itbi.py', 'scripts/preprocess_itbi.py') }}

      # The Prefeitura's server intermittently blocks GitHub-hosted runners.
      # Don't let that block deploying site changes: fall back to the parquet
      # currently live on Pages (below) instead of failing the whole run.
      - name: Download ITBI Excel files (last 5 years)
        id: download
        if: steps.cache-parquet.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/download_itbi.py

      - name: Preprocess → parquet
        id: preprocess
        if: steps.download.outcome == 'success'
        run: python scripts/preprocess_itbi.py

      # Saved only when freshly built, so a fallback copy never occupies this
      # month's cache key and the next run retries the download.
      - name: Save parquet to cache
        if: steps.preprocess.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: parquet
          key: ${{ steps.cache-parquet.outputs.cache-primary-key }}

      # Live site has per-year files + manifest; before the switch to that layout
      # it had a single itbi_sp_5y.parquet, which is split into years here.
      - name: Fall back to currently deployed data
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::ITBI download failed — redeploying the data currently live on Pages"
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p parquet
          if curl -fsSL --retry 3 -o parquet/manifest.json "$BASE/parquet/manifest.json"; then
            for f in $(python -c "import json; print(' '.join(e['file'] for e in json.load(open('parquet/manifest.json'))['years']))"); do
              curl -fsSL --retry 3 -o "parquet/$f" "$BASE/parquet/$f"
            done
          else
            curl -fsSL --retry 3 -o legacy.parquet "$BASE/itbi_sp_5y.parquet"
            python scripts/preprocess_itbi.py --repartition legacy.parquet
          fi

      - name: Prepare site artifact
        run: |
          mkdir -p site
          cp index.html site/
          cp -r parquet site/
          mkdir -p site/geo
          cp geo/quadras_geo.parquet site/geo/
          ls -lh site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
